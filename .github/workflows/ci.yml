name: CI

on:
    pull_request:
        branches:
            - main
            - dev
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Format, lint, types, dead code
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.21'
                  cache: npm
            - run: npm ci

            - name: Format
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Types
              run: npm run typecheck

            - name: Dead code and dependencies
              continue-on-error: true
              run: npm run knip

            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

    unit:
        name: Unit tests
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.21'
                  cache: npm
            - run: npm ci
            - run: npm test

    e2e:
        name: E2E tests
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: eblocul_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d eblocul_e2e"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eblocul_e2e
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.21'
                  cache: npm
            - run: npm ci
            - run: npm run test:e2e

            - name: Schema matches migrations
              env:
                  NODE_ENV: e2e
              run: node_modules/.bin/prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

    build:
        name: Build and Docker image
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.21'
                  cache: npm
            - run: npm ci
            - run: npm run build

            - uses: docker/setup-buildx-action@v4
            - name: Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
